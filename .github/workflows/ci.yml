name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint (no auto-fix)
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm run test

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      # Bloqueante: lo que de verdad viaja en el contenedor. El Dockerfile
      # instala con --prod, asi que una vulnerabilidad en jest o eslint no
      # llega a produccion y no deberia impedir un despliegue.
      - name: Audit production dependencies
        run: pnpm audit --audit-level=moderate --prod

      # Informativo: el arbol completo, herramientas de desarrollo incluidas.
      # No bloquea, pero deja el aviso visible en el log para revisarlo.
      - name: Audit all dependencies (informativo)
        run: pnpm audit --audit-level=moderate || true
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Sin load, buildx deja la imagen en su propio almacen y NO en el
          # daemon: Trivy no la encuentra y el escaneo no analiza nada.
          load: true
          tags: kori-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          tags: kori-backend:migrator-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Version fijada, no @master: una accion de seguridad que cambia sola
      # bajo los pies es justo lo que no quieres en la cadena de suministro.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kori-backend:ci
          format: table
          # Informativo: los CVE de la imagen base de Node aparecen y
          # desaparecen constantemente y no dependen de nosotros.
          exit-code: "0"
          severity: CRITICAL,HIGH
          # Solo lo que tiene parche disponible; el resto no es accionable.
          ignore-unfixed: true
        # Sin continue-on-error a proposito: los hallazgos no bloquean, pero
        # un escaner que no puede ejecutarse SI tiene que verse en rojo.
        # Con ambas cosas, el escaneo llevaba tiempo sin analizar nada.

name: Keep alive

# Nacio para evitar que Supabase (plan free) pausara el proyecto tras ~7 dias
# sin actividad de base de datos. Con la base en RDS eso ya no ocurre: RDS no
# se pausa y el servidor de EC2 no se duerme.
#
# Se conserva como monitor, que es para lo que sirve ahora: /health/readiness
# ejecuta un `SELECT 1`, asi que un fallo aqui significa que el backend no
# responde o que no llega a la base. Si el job falla, GitHub avisa por correo.
#
# OJO: GitHub desactiva los workflows programados tras 60 dias sin commits en
# el repo, asi que esto no sustituye a un monitor externo de verdad.

on:
  schedule:
    # Cada 6 horas: de sobra para una pausa que tarda 7 dias en llegar.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Despertar backend y validar la DB
        env:
          # Variable del repo; si no esta definida, usa la URL de produccion.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://api.insecurekori.com' }}
        run: |
          set -uo pipefail

          url="${BACKEND_URL%/}/health/readiness"

          # EC2 no se duerme: los reintentos cubren un despliegue en curso,
          # no un arranque en frio.
          for attempt in 1 2 3 4; do
            echo "::group::Intento $attempt"
            body=$(curl -sS --max-time 120 -w '\n%{http_code}' "$url" 2>&1) && rc=0 || rc=$?
            status=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "curl rc=$rc http=$status"
            echo "$payload"
            echo "::endgroup::"

            if [ "$rc" -eq 0 ] && [ "$status" = "200" ]; then
              # No basta con el 200: readiness puede responder sin la DB viva.
              if printf '%s' "$payload" | grep -q '"database":"ok"'; then
                echo "Backend despierto y base de datos accesible."
                exit 0
              fi
              echo "::warning::200 pero la DB no reporta ok."
            fi

            [ "$attempt" -lt 4 ] && sleep $((attempt * 20))
          done

          echo "::error::El backend no respondio con la DB accesible tras 4 intentos."
          echo "Revisa, en la instancia EC2 (por SSM, no hace falta SSH):"
          echo "  docker compose ps        - el contenedor esta en Restarting?"
          echo "  docker compose logs api  - por que murio"
          echo "Si son credenciales: DATABASE_URL/DIRECT_URL en /home/ec2-user/.env,"
          echo "y despues docker compose up -d (restart NO recarga env_file)."
          exit 1

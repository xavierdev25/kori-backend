name: Backup

# Copia de seguridad diaria de la base de datos.
#
# Por que hace falta: el plan gratuito de Supabase NO tiene point-in-time
# recovery. Si algo borra datos o una migracion sale mal, sin esto no hay
# vuelta atras. Con pedidos pagados en la tabla, eso no es aceptable.
#
# El volcado se CIFRA antes de subirlo: contiene correos y direcciones de
# compradores, y un artefacto de CI no es sitio para datos personales en
# claro. Para restaurar hace falta BACKUP_PASSPHRASE.

on:
  schedule:
    # 08:00 UTC = 02:00 en CDMX. Fuera de horas de compra.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: Volcado cifrado
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Comprobar secretos
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -uo pipefail
          missing=0
          [ -z "${DIRECT_URL:-}" ] && { echo "::error::Falta el secreto DIRECT_URL"; missing=1; }
          [ -z "${BACKUP_PASSPHRASE:-}" ] && { echo "::error::Falta el secreto BACKUP_PASSPHRASE"; missing=1; }
          exit $missing

      - name: Instalar cliente de PostgreSQL 17
        run: |
          set -euo pipefail
          # El cliente del runner suele ir por detras del servidor de Supabase,
          # y pg_dump se niega a volcar una version mayor que la suya.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Volcar y cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          # La conexion directa, no el pooler: pg_dump necesita sesiones reales.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail

          stamp="$(date -u +%Y%m%d-%H%M)"
          file="kori-${stamp}.sql.gz"

          pg_dump "$DIRECT_URL" \
            --no-owner --no-privileges --clean --if-exists \
            | gzip -9 > "$file"

          size=$(stat -c%s "$file")
          echo "Volcado: $file (${size} bytes)"

          # Un volcado de 0 bytes es un fallo silencioso: mejor romper aqui.
          if [ "$size" -lt 1024 ]; then
            echo "::error::El volcado pesa menos de 1 KB. Algo fallo."
            exit 1
          fi

          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "${file}.gpg" "$file"

          rm -f "$file"
          echo "BACKUP_FILE=${file}.gpg" >> "$GITHUB_ENV"

      - name: Verificar que se puede descifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Una copia que no se puede restaurar no es una copia. Se comprueba
          # aqui, no el dia que haga falta de verdad.
          gpg --batch --yes --decrypt --passphrase "$BACKUP_PASSPHRASE" \
            "$BACKUP_FILE" 2>/dev/null | gunzip | head -c 200 | grep -q "PostgreSQL database dump" \
            && echo "Descifrado y contenido verificados."

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          # 30 dias: suficiente para detectar un borrado y volver atras, sin
          # acumular datos personales mas tiempo del necesario.
          retention-days: 30
          if-no-files-found: error

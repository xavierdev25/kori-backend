# pnpm dejo de leer el campo "pnpm" de package.json: estos ajustes viven aqui.
# (Eso explica el aviso de onlyBuiltDependencies que salia en cada comando.)

overrides:
  # @nestjs/platform-express arrastra multer 2.1.x de forma transitiva, y esa
  # version tiene dos avisos de seguridad. Es la unica de todo el arbol que
  # llega al contenedor de produccion, asi que se fuerza la parcheada.
  multer: ">=2.2.0"

  # sanitize-html se queda en 2.17.4: la 2.17.6 arrastra htmlparser2@12, que
  # es solo ESM y rompe Jest (CommonJS). Sus dos avisos venian de estas dos
  # dependencias transitivas, asi que se parchean directamente en vez de
  # subir la libreria entera.
  postcss: ">=8.5.23"
  nanoid: ">=3.3.8"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - bcrypt
  - prisma
  - unrs-resolver

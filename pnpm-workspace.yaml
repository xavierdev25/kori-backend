# pnpm dejo de leer el campo "pnpm" de package.json: estos ajustes viven aqui.
# (Eso explica el aviso de onlyBuiltDependencies que salia en cada comando.)

overrides:
  # @nestjs/platform-express arrastra multer 2.1.x de forma transitiva, y esa
  # version tiene dos avisos de seguridad. Es la unica de todo el arbol que
  # llega al contenedor de produccion, asi que se fuerza la parcheada.
  # 2.4.0: subidas abortadas que dejaban escrituras huerfanas en disco (DoS).
  # 2.5.0: DoS con una escritura asincrona pendiente.
  multer: "^2.5.0"

  # NOTA sobre sanitize-html: aqui ponia que se quedaba en 2.17.4 porque la
  # 2.17.6 arrastra htmlparser2@12 (solo ESM) y rompia Jest, y que sus avisos
  # se parcheaban en las dependencias transitivas. Eso dejo de valer: los dos
  # avisos siguientes son fallos del propio sanitize-html, asi que no habia
  # nada debajo que parchear. Se subio a 2.17.7 y el problema de Jest se
  # resuelve en `jest.esm-cjs.cjs`, que explica el como y el porque.

  # `qs` llega por express y tiene dos avisos de denegacion de servicio. Es
  # quien parsea la query string de CADA peticion, asi que se fuerza.
  qs: ">=6.16.0"

  # `deepmerge-ts` entra por el cargador de configuracion de Prisma. Solo se
  # usa al aplicar migraciones, no en el camino de una peticion, pero el
  # parche es limpio y no cuesta nada.
  deepmerge-ts: ">=8.0.0"

  postcss: ">=8.5.23"
  nanoid: ">=3.3.8"

  # Avisos de octubre de 2026 en dependencias que trae express (por
  # @nestjs/platform-express) o sanitize-html. Van con ^ y no con >=: un
  # parche de seguridad no debe poder colar una version mayor sin que nadie
  # lo decida.
  #
  # proxy-addr (CRITICO): es quien decide la IP real del cliente cuando
  # TRUST_PROXY nombra proxies de confianza. Con TRUST_PROXY como lista de
  # subredes (p. ej. los rangos de Cloudflare), una IPv6 que envuelve una IPv4
  # podia pasar por proxy de confianza y falsear la IP: la que usan los limites
  # por IP y las huellas de notitas, contacto y la señal.
  proxy-addr: "^2.0.8"

  # body-parser: denegacion de servicio con un `limit` invalido (2.3.0) y con
  # bytes de mas al final del cuerpo (2.4.0).
  body-parser: "^2.4.0"

  # source-map-js: llega por sanitize-html > postcss; denegacion de servicio
  # con mapas de origen manipulados.
  source-map-js: "^1.2.2"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - bcrypt
  - prisma
  - unrs-resolver
